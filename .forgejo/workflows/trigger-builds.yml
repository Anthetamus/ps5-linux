name: deploy

on:
  workflow_dispatch:
    inputs:
      distro:
        description: 'Which distros to build'
        default: 'ubuntu2604'
        type: choice
        options: [all, ubuntu2604, debian13-xfce, debian13-server, debian13-gnome, debian13-kde, arch, cachyos, alpine, fedora, fedora-kde, bazzite]

jobs:
  image:
    permissions:
      contents: write
    uses: ./.forgejo/workflows/build-image.yml
    with:
      distro: ${{ inputs.distro }}
