name: deploy

on:
  workflow_dispatch:
    inputs:
      distro:
        description: 'Which distros to build'
        default: 'ubuntu2604'
        type: choice
        options: [all, ubuntu2604, mint22-cinnamon, debian13-xfce, debian13-server, debian13-gnome, debian13-kde, debian13-proxmox, arch, cachyos, alpine, fedora-gnome, fedora-kde, bazzite, bazzite-deck, batocera, artix-openrc, devuan-sway, miaos, artix-runit]

jobs:
  image:
    permissions:
      contents: write
    uses: ./.forgejo/workflows/build-image.yml
    with:
      distro: ${{ inputs.distro }}
