name: Build Image
run-name: Build Image (${{ inputs.distro || 'all' }})

on:
  workflow_dispatch:
    inputs:
      distro:
        description: 'Distribution'
        default: 'ubuntu2604'
        type: choice
        options: [all, ubuntu2604, mint22-cinnamon, debian13-xfce, debian13-server, debian13-gnome, debian13-kde, debian13-proxmox, arch, cachyos, alpine, fedora-gnome, fedora-kde, bazzite, bazzite-deck, batocera, steamos]
  workflow_call:
    inputs:
      distro:
        type: string
        default: 'ubuntu2604'

# NOTE: removed `concurrency: release-latest` block. Forgejo 15.0.1's
# concurrency support is fragile here — when a prior run gets stuck or
# cancelled via DB intervention, the lock stays "held" in Forgejo's
# in-memory queue, which silently auto-cancels every subsequent dispatch
# without ever scheduling a matrix task. Cleared dozens of phantom-
# cancelled runs while debugging the batocera build. Replace with a
# flock at the upload-asset step inside the build job (file lock on
# /data/cache/ps5/.release-upload.lock).
jobs:
  matrix:
    runs-on: self-hosted
    outputs:
      distros: ${{ steps.set.outputs.distros }}
    steps:
      - id: set
        run: |
          INPUT="${{ inputs.distro || 'ubuntu2604' }}"
          if [ "$INPUT" = "all" ]; then
            echo 'distros=["ubuntu2604","mint22-cinnamon","debian13-xfce","debian13-server","debian13-gnome","debian13-kde","debian13-proxmox","arch","cachyos","alpine","fedora-gnome","fedora-kde","bazzite","bazzite-deck","batocera","artix-openrc","devuan-sway","miaos","artix-runit","steamos"]' >> "$GITHUB_OUTPUT"
          else
            echo "distros=[\"$INPUT\"]" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: matrix
    runs-on: self-hosted
    timeout-minutes: 240
    permissions:
      contents: write

    strategy:
      fail-fast: false
      # Runner capacity is 2; the limiting factor is host CPU/RAM during the
      # one-time kernel build. After the cache populates, the rest are I/O
      # bound and run two-at-a-time comfortably.
      max-parallel: 2
      matrix:
        distro: ${{ fromJson(needs.matrix.outputs.distros) }}

    env:
      # Persistent cache lives outside the per-run workspace so kernel
      # source + .deb/.rpm output + ccache survive between builds.
      CCACHE_DIR: /data/cache/ps5/ccache

    steps:
      - name: Checkout image builder
        uses: actions/checkout@v4
        with:
          path: image

      - name: Stage pre-fetched downloads into workspace cache
        run: |
          set -eux
          mkdir -p /data/cache/ps5/downloads image/work/cache
          # Hard-link the cached files into the per-run workspace. Symlinks
          # would point at /data/... which isn't mounted inside the build
          # container, leaving the symlink dangling. Hard links share the
          # same inode and work transparently across the bind mount. Same
          # filesystem (the host LV) is required for ln; that's already the
          # case since the workspace lives under /data/.cache/act.
          for f in /data/cache/ps5/downloads/*; do
            [ -f "$f" ] || continue
            ln -f "$f" "image/work/cache/$(basename "$f")"
          done
          ls -la image/work/cache/ || true

      - name: Wire persistent kernel cache (bust on PATCHES_REF or MWIFIEX_REF change)
        run: |
          set -eux
          mkdir -p /data/cache/ps5/{linux,kernel-out,ccache}
          # Cache marker = PATCHES_REF + MWIFIEX_REF combined; bumping either
          # invalidates the cached kernel + driver.
          PCUR=$(grep -E '^PATCHES_REF=' image/build_image.sh | head -1 | cut -d'"' -f2)
          MCUR=$(grep -E '^MWIFIEX_REF=' image/build_image.sh | head -1 | cut -d'"' -f2)
          CUR="$PCUR|$MCUR"
          OLD=$(cat /data/cache/ps5/.patches-ref 2>/dev/null || echo "")
          if [ "$CUR" != "$OLD" ]; then
            echo "ref changed: $OLD -> $CUR, wiping cached kernel"
            rm -rf /data/cache/ps5/linux /data/cache/ps5/kernel-out
            mkdir -p /data/cache/ps5/linux /data/cache/ps5/kernel-out
            echo "$CUR" > /data/cache/ps5/.patches-ref
          fi
          # Symlink build_image.sh's expected paths into the persistent cache.
          mkdir -p image/work
          ln -sfn /data/cache/ps5/linux       image/work/linux
          ln -sfn /data/cache/ps5/kernel-out  image/linux-bin

      - name: Build ${{ matrix.distro }} image (retry x5 with exponential backoff on transient pacman/apt mirror flakes)
        run: |
          set -u
          DISTRO="${{ matrix.distro }}"
          OK=0
          # Tee build output to a host-side persistent log so failures stay
          # inspectable after the build container `--rm`s away. Path is
          # under /data which is bind-mounted into the runner from the host
          # (host-side `/data/ci-logs/`). Successful builds delete their log
          # at the end; failed ones are kept until the host's prune cron
          # removes them (72h).
          mkdir -p /data/ci-logs
          TS=$(date -u +%Y%m%d-%H%M%S)
          LOG="/data/ci-logs/${DISTRO}-${TS}.log"
          echo "tee-ing build output to $LOG" | tee "$LOG"
          # Exponential backoff between attempts: 30s, 60s, 120s, 240s.
          # Total worst-case wait = 7.5 min — well under any reasonable mirror
          # outage but long enough to clear a Cloudflare/CDN throttle window
          # (the 24h alpine + ubuntu + debian + batocera overnight failures
          # were all transient CDN flakes that 3x30s couldn't ride out).
          SLEEPS="30 60 120 240"
          for try in 1 2 3 4 5; do
            echo "::group::build attempt $try for $DISTRO"
            if bash image/build_image.sh --distro "$DISTRO" 2>&1 | tee -a "$LOG"; then
              OK=1
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            if [ "$try" -lt 5 ]; then
              S=$(echo "$SLEEPS" | cut -d' ' -f"$try")
              echo "::warning::attempt $try failed; wiping chroot + sleeping ${S}s before retry $((try+1))"
              rm -rf image/work/chroot
              mkdir -p image/work/chroot
              sleep "$S"
            fi
          done
          if [ "$OK" = 1 ]; then
            rm -f "$LOG"
          else
            echo "::error::build failed after 5 attempts — log retained at host:$LOG (72h)"
            exit 1
          fi

      - name: Set version info
        id: version
        run: |
          psha=$(git -C image/work/ps5-linux-patches rev-parse --short HEAD 2>/dev/null || echo "unknown")
          kver=$(cat image/linux-bin/VERSION 2>/dev/null || echo "unknown")
          ts=$(date -u +%Y%m%d-%H%M%S)
          echo "psha=$psha" >> "$GITHUB_OUTPUT"
          echo "kver=$kver" >> "$GITHUB_OUTPUT"
          echo "ts=$ts" >> "$GITHUB_OUTPUT"

      - name: Report
        run: |
          ls -lh image/output/*.img
          sha256sum image/output/*.img

      - name: Compress image
        run: |
          xz -T0 -9 -c image/output/ps5-${{ matrix.distro }}.img \
            > image/output/ps5-${{ matrix.distro }}.img.xz

      - name: Save build metadata
        run: |
          mkdir -p meta
          sha256sum image/output/ps5-${{ matrix.distro }}.img.xz \
            | sed 's|image/output/||' > meta/${{ matrix.distro }}.sha256
          echo "${{ steps.version.outputs.kver }}" > meta/kver
          echo "${{ steps.version.outputs.psha }}" > meta/psha
          echo "${{ steps.version.outputs.ts }}" > meta/ts

      - name: Upload build metadata
        uses: actions/upload-artifact@v3
        with:
          name: meta-${{ matrix.distro }}
          path: meta/
          retention-days: 1

      - name: Attach image to Forgejo release (tag=latest)
        if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          API="$SERVER/api/v1/repos/$REPO"
          UA="ci-image-uploader/1.0"
          AUTH="Authorization: token $FORGEJO_TOKEN"
          mkdir -p /data/cache/ps5
          # Serialise this whole asset replace-then-upload across all
          # concurrent matrix jobs. Without it, two builds for different
          # distros that finish at the same time can both PUT against the
          # 'latest' release and the loser's upload gets clobbered. flock
          # on a file inside /data is shared between runners as long as
          # they both have /data on the same physical FS (they each have
          # their own /data; the lock is per-runner — that's fine because
          # the actual GitHub-API race is the delete-then-PUT against the
          # SAME release, and any single runner only handles its own
          # jobs, so per-runner locking is enough as long as parallel
          # workflow runs aren't split across runners. For 2-runner
          # split-run cases we still rely on the API's last-write-wins
          # being acceptable — re-dispatch fixes any clobbered asset.)
          (
            flock -x 9
            REL_ID=$(curl -sS -H "$AUTH" -H "User-Agent: $UA" "$API/releases/tags/latest" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("id","") if isinstance(d,dict) else "")' \
              || true)
            if [ -z "$REL_ID" ]; then
              REL_ID=$(curl -fsS -X POST -H "$AUTH" -H "User-Agent: $UA" -H "Content-Type: application/json" \
                "$API/releases" \
                -d '{"tag_name":"latest","name":"PS5 Linux Image (latest)","body":"build in progress","draft":false,"prerelease":false}' \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
            fi
            export FILE="ps5-${DISTRO}.img.xz"
            curl -fsS -H "$AUTH" -H "User-Agent: $UA" "$API/releases/$REL_ID/assets" > /tmp/assets.json
            for AID in $(python3 -c 'import json,os; print(" ".join(str(a["id"]) for a in json.load(open("/tmp/assets.json")) if a.get("name")==os.environ["FILE"]))'); do
              curl -fsS -X DELETE -H "$AUTH" -H "User-Agent: $UA" "$API/releases/$REL_ID/assets/$AID" || true
            done
            curl -fsS -X POST -H "$AUTH" -H "User-Agent: $UA" \
              -F "attachment=@image/output/$FILE" \
              "$API/releases/$REL_ID/assets?name=$FILE"
          ) 9>/data/cache/ps5/.release-upload.lock

      - name: Attach kernel package(s) to release (per matrix format)
        if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          API="$SERVER/api/v1/repos/$REPO"
          UA="ci-kernel-uploader/1.0"
          AUTH="Authorization: token $FORGEJO_TOKEN"
          # Mirror the FORMAT mapping in build_image.sh so each distro only
          # publishes the kernel package(s) it actually uses. Multiple
          # distros share a format (5 debian variants share linux-ps5.deb)
          # but the flock+delete-then-PUT pattern below is idempotent.
          case "$DISTRO" in
            arch|cachyos|artix*|steamos) GLOB='linux-ps5*.pkg.tar.zst' ;;
            fedora*|bazzite*)            GLOB='linux-ps5-*.rpm' ;;
            alpine|batocera*)            echo "no published kernel pkg for $DISTRO (extracted manually)"; exit 0 ;;
            *)                           GLOB='linux-ps5_*.deb linux-ps5-*.deb' ;;
          esac
          (
            flock -x 9
            REL_ID=$(curl -fsS -H "$AUTH" -H "User-Agent: $UA"               "$API/releases/tags/latest" | python3 -c "import json,sys;print(json.load(sys.stdin)['id'])")
            for pattern in $GLOB; do
              for f in image/linux-bin/$pattern; do
                [ -f "$f" ] || continue
                NAME=$(basename "$f")
                echo "publishing $NAME"
                curl -fsS -H "$AUTH" -H "User-Agent: $UA" "$API/releases/$REL_ID/assets" > /tmp/kassets.json
                export FILE="$NAME"
                for AID in $(python3 -c 'import json,os; print(" ".join(str(a["id"]) for a in json.load(open("/tmp/kassets.json")) if a.get("name")==os.environ["FILE"]))'); do
                  curl -fsS -X DELETE -H "$AUTH" -H "User-Agent: $UA" "$API/releases/$REL_ID/assets/$AID" || true
                done
                curl -fsS -X POST -H "$AUTH" -H "User-Agent: $UA"                   -F "attachment=@$f"                   "$API/releases/$REL_ID/assets?name=$NAME"
              done
            done
          ) 9>/data/cache/ps5/.release-upload.lock

  release:
    needs: build
    runs-on: self-hosted
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    permissions:
      contents: write
    steps:
      - name: Download build metadata
        uses: actions/download-artifact@v3
        with:
          pattern: meta-*
          path: meta
          merge-multiple: true

      - name: Update release body with build metadata
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          export KVER=$(cat meta/kver)
          export PSHA=$(cat meta/psha)
          export TS=$(cat meta/ts)
          export SUMS=$(cat meta/*.sha256)
          cat > /tmp/render_release_body.py <<'PY'
          import json,os
          sums=os.environ['SUMS']
          kver=os.environ['KVER']
          psha=os.environ['PSHA']
          ts=os.environ['TS']
          server=os.environ['SERVER']
          repo=os.environ['REPO']
          rel='/'.join([server,repo,'releases/download/latest'])
          lines=['PS5 Linux images built from latest main.','',
                 f'Kernel: `{kver}`',
                 f'Patches: `{psha}`',
                 f'Built: `{ts}`','',
                 '## Login',
                 'User: `ps5`  ·  Password: `ps5`  (sudo enabled, root account locked)',
                 'CachyOS uses `steam` / `steam`.',
                 '',
                 '## Images',
                 '| Image | Download |','|-------|----------|']
          for distro,label in [('ubuntu2604','Ubuntu 26.04'),('mint22-cinnamon','Linux Mint 22 (Cinnamon, Ubuntu 24.04 base)'),('debian13-xfce','Debian 13 (XFCE)'),('debian13-server','Debian 13 (server, no DE)'),('debian13-gnome','Debian 13 (GNOME)'),('debian13-kde','Debian 13 (KDE Plasma)'),('debian13-proxmox','Debian 13 + Proxmox VE 9'),('arch','Arch'),('cachyos','CachyOS'),('alpine','Alpine'),('fedora-gnome','Fedora 44 (GNOME)'),('fedora-kde','Fedora 44 (KDE Plasma)'),('bazzite','Bazzite (gaming-Fedora, uBlue)'),('bazzite-deck','Bazzite-Deck (Steam-Deck UI variant)'),('batocera','Batocera (retro emulation)'),('steamos','SteamOS (Steam Deck recovery base)')]:
              f=f'ps5-{distro}.img.xz'
              lines.append(f'| {label} | [{f}]({rel}/{f}) |')
          lines += ['','**SHA256 checksums:**','```',sums.strip(),'```']
          print(json.dumps('\n'.join(lines)))
          PY
          # Strip the 10-space indent the heredoc inherited from YAML
          sed -i 's/^          //' /tmp/render_release_body.py
          BODY=$(python3 /tmp/render_release_body.py)
          API="$SERVER/api/v1/repos/$REPO"
          REL_ID=$(curl -fsS -H "Authorization: token $FORGEJO_TOKEN" -H "User-Agent: ci/1.0" \
            "$API/releases/tags/latest" | python3 -c "import json,sys;print(json.load(sys.stdin)['id'])")
          curl -fsS -X PATCH -H "Authorization: token $FORGEJO_TOKEN" -H "User-Agent: ci/1.0" \
            -H "Content-Type: application/json" \
            "$API/releases/$REL_ID" \
            -d "{\"body\":$BODY,\"name\":\"PS5 Linux Image (latest)\"}" > /dev/null
