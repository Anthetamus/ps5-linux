name: Upstream kernel watch
run-name: Watch ps5-linux-patches for new kernel-*

# Daily check; also runnable manually.
on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC every day
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Compare upstream latest vs current PATCHES_REF
        id: cmp
        run: |
          set -euo pipefail
          LATEST=$(git ls-remote --tags https://github.com/ps5-linux/ps5-linux-patches.git \
            | grep -oE 'kernel-[0-9]+\.[0-9]+\.[0-9]+-[a-f0-9]+' \
            | sort -V \
            | tail -1)
          if [ -z "$LATEST" ]; then
            echo "no kernel-*-* tags found upstream"; exit 1
          fi
          CUR=$(grep -E '^PATCHES_REF=' build_image.sh | head -1 | cut -d'"' -f2)
          echo "upstream latest: $LATEST"
          echo "current ref:     $CUR"
          echo "latest=$LATEST"  >> "$GITHUB_OUTPUT"
          echo "current=$CUR"    >> "$GITHUB_OUTPUT"
          if [ "$LATEST" = "$CUR" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true"  >> "$GITHUB_OUTPUT"
          fi

      - name: Bump + commit + push + dispatch
        if: steps.cmp.outputs.stale == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          LATEST: ${{ steps.cmp.outputs.latest }}
          CUR: ${{ steps.cmp.outputs.current }}
        run: |
          set -euo pipefail
          sed -i "s|^PATCHES_REF=\"${CUR}\"|PATCHES_REF=\"${LATEST}\"|" build_image.sh
          git config user.name  "mia"
          git config user.email "mia@noreply.git.etawen.dev"
          git add build_image.sh
          git commit -m "kernel: auto-bump ${CUR} -> ${LATEST} (upstream watch)"
          # Push via the workflow token. Commit will be unsigned (no key inside
          # the runner) and that's fine for an automated bump.
          git push "https://x-access-token:${TOKEN}@${SERVER#https://}/${REPO}.git" HEAD:main
          # Dispatch an 'all' build to produce fresh images on the new kernel.
          curl -fsS -X POST \
            -H "Authorization: token ${TOKEN}" \
            -H "User-Agent: upstream-watch/1.0" \
            -H "Content-Type: application/json" \
            "${SERVER}/api/v1/repos/${REPO}/actions/workflows/trigger-builds.yml/dispatches" \
            -d '{"ref":"main","inputs":{"distro":"all"}}'
          echo "dispatched 'all' build for ${LATEST}"
