name: Build TinyCore
run-name: Build TinyCore image

on:
  workflow_dispatch:

# Standalone — does NOT reuse build-image.yml's matrix. TinyCore is
# built outside the distrobuilder pipeline: we only need the kernel
# (built via --kernel-only) plus a copy of the cyan_skillfish firmware
# blob (downloaded from Debian's firmware-amd-graphics package). Total
# build time is dominated by the one-time kernel build; subsequent runs
# hit the cached kernel-out and complete in ~3 minutes.
jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 120
    permissions:
      contents: write

    env:
      CCACHE_DIR: /data/cache/ps5/ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: image

      - name: Stage pre-fetched downloads
        run: |
          set -eux
          mkdir -p /data/cache/ps5/downloads image/work/cache
          for f in /data/cache/ps5/downloads/*; do
            [ -f "$f" ] || continue
            ln -f "$f" "image/work/cache/$(basename "$f")"
          done

      - name: Wire persistent kernel cache (bust on PATCHES_REF/MWIFIEX_REF change)
        run: |
          set -eux
          mkdir -p /data/cache/ps5/{linux,kernel-out,ccache}
          PCUR=$(grep -E '^PATCHES_REF=' image/build_image.sh | head -1 | cut -d'"' -f2)
          MCUR=$(grep -E '^MWIFIEX_REF=' image/build_image.sh | head -1 | cut -d'"' -f2)
          CUR="$PCUR|$MCUR"
          OLD=$(cat /data/cache/ps5/.patches-ref 2>/dev/null || echo "")
          if [ "$CUR" != "$OLD" ]; then
            rm -rf /data/cache/ps5/linux /data/cache/ps5/kernel-out
            mkdir -p /data/cache/ps5/linux /data/cache/ps5/kernel-out
            echo "$CUR" > /data/cache/ps5/.patches-ref
          fi
          mkdir -p image/work
          ln -sfn /data/cache/ps5/linux       image/work/linux
          ln -sfn /data/cache/ps5/kernel-out  image/linux-bin

      - name: Build linux-ps5 kernel (--kernel-only)
        run: |
          set -u
          OK=0
          mkdir -p /data/ci-logs
          TS=$(date -u +%Y%m%d-%H%M%S)
          LOG="/data/ci-logs/tinycore-kernel-${TS}.log"
          SLEEPS="30 60 120 240"
          for try in 1 2 3 4 5; do
            echo "::group::kernel build attempt $try"
            if bash image/build_image.sh --kernel-only 2>&1 | tee -a "$LOG"; then
              OK=1
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            if [ "$try" -lt 5 ]; then
              S=$(echo "$SLEEPS" | cut -d' ' -f"$try")
              echo "::warning::attempt $try failed; sleeping ${S}s"
              sleep "$S"
            fi
          done
          [ "$OK" = 1 ] || { echo "::error::kernel build failed; log $LOG"; exit 1; }
          rm -f "$LOG"

      - name: Locate kernel artifacts
        id: kernel
        run: |
          set -eux
          # staging/ is populated by docker/kernel-builder; it mirrors the
          # `make install_modules` layout the kernel packages get built from.
          BZIMAGE="image/linux-bin/staging/boot/bzImage"
          MODULES_DIR="image/linux-bin/staging/lib/modules/$(ls image/linux-bin/staging/lib/modules | head -1)"
          [ -f "$BZIMAGE" ]    || { echo "::error::no bzImage at $BZIMAGE"; ls -la image/linux-bin/staging/boot/ 2>/dev/null; exit 1; }
          [ -d "$MODULES_DIR" ] || { echo "::error::no modules dir at $MODULES_DIR"; ls image/linux-bin/staging/lib/modules/ 2>/dev/null; exit 1; }
          echo "bzimage=$BZIMAGE"     >> "$GITHUB_OUTPUT"
          echo "modules=$MODULES_DIR" >> "$GITHUB_OUTPUT"
          echo "bzimage size: $(stat -c%s "$BZIMAGE") bytes"
          echo "modules:     $(find "$MODULES_DIR" -name '*.ko' | wc -l) .ko files"

      - name: Install host build tooling (if not already present)
        run: |
          set -eux
          # Stay distro-agnostic: try apt, pacman, or dnf — whichever the
          # runner host has. Don't fail if one is missing; only error if a
          # required binary is still absent after all attempts.
          NEED="cpio zstd xz parted mkfs.vfat mkfs.ext4"
          if command -v apt-get >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y cpio zstd xz-utils parted dosfstools e2fsprogs || true
          elif command -v pacman >/dev/null; then
            sudo pacman -Sy --noconfirm cpio zstd xz parted dosfstools e2fsprogs || true
          elif command -v dnf >/dev/null; then
            sudo dnf install -y cpio zstd xz parted dosfstools e2fsprogs || true
          fi
          for b in $NEED; do
            command -v "$b" >/dev/null || { echo "::error::missing required tool $b"; exit 1; }
          done

      - name: Build tinycore image
        run: |
          set -eux
          mkdir -p image/output
          # Firmware: uses bundled distros/tinycore/firmware/amdgpu/ by
          # default (uncompressed cyan_skillfish blobs from upstream
          # linux-firmware, shipped in the repo — no per-distro dep).
          bash image/distros/tinycore/build.sh \
            --bzimage      "${{ steps.kernel.outputs.bzimage }}" \
            --modules-dir  "${{ steps.kernel.outputs.modules }}" \
            --output       image/output/ps5-tinycore.img

      - name: Report
        run: |
          ls -lh image/output/ps5-tinycore.img
          sha256sum image/output/ps5-tinycore.img

      - name: Compress image
        run: |
          xz -T0 -9 -c image/output/ps5-tinycore.img \
            > image/output/ps5-tinycore.img.xz
          ls -lh image/output/ps5-tinycore.img.xz

      - name: Attach to Forgejo release (tag=latest)
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          API="$SERVER/api/v1/repos/$REPO"
          UA="ci-tinycore-uploader/1.0"
          AUTH="Authorization: token $FORGEJO_TOKEN"
          mkdir -p /data/cache/ps5
          (
            flock -x 9
            REL_ID=$(curl -sS -H "$AUTH" -H "User-Agent: $UA" "$API/releases/tags/latest" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("id","") if isinstance(d,dict) else "")' || true)
            if [ -z "$REL_ID" ]; then
              REL_ID=$(curl -fsS -X POST -H "$AUTH" -H "User-Agent: $UA" -H "Content-Type: application/json" \
                "$API/releases" \
                -d '{"tag_name":"latest","name":"PS5 Linux Image (latest)","body":"build in progress","draft":false,"prerelease":false}' \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
            fi
            FILE="ps5-tinycore.img.xz"
            curl -fsS -H "$AUTH" -H "User-Agent: $UA" "$API/releases/$REL_ID/assets" > /tmp/assets.json
            for AID in $(FILE="$FILE" python3 -c 'import json,os; print(" ".join(str(a["id"]) for a in json.load(open("/tmp/assets.json")) if a.get("name")==os.environ["FILE"]))'); do
              curl -fsS -X DELETE -H "$AUTH" -H "User-Agent: $UA" "$API/releases/$REL_ID/assets/$AID" || true
            done
            curl -fsS -X POST -H "$AUTH" -H "User-Agent: $UA" \
              -F "attachment=@image/output/$FILE" \
              "$API/releases/$REL_ID/assets?name=$FILE"
          ) 9>/data/cache/ps5/.release-upload.lock
