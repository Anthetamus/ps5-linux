image:
  name: ps5-arch
  distribution: archlinux
  description: Minimal Arch Linux (console; GNOME, KDE Plasma or Sway at first boot)
  architecture: x86_64

source:
  downloader: archlinux-http
  url: https://geo.mirror.pkgbuild.com/iso
  skip_verification: true

packages:
  manager: pacman
  update: true
  cleanup: true

  repositories:
  - name: mirrorlist
    url: |-
      Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

  sets:
  - packages:
    # Console-only base, no default user. First boot asks for locale,
    # keyboard, timezone and an account, then offers GNOME, KDE Plasma or
    # Sway (ps5-install-desktop), which can also be run later.

    # Networking (SSH installed but not enabled)
    - networkmanager
    - openssh

    # Firmware: AMD GPU + misc (the NXP wifi blob comes from the EFI partition)
    - linux-firmware-amdgpu
    - linux-firmware-other

    # System
    - base
    - sudo
    - nano
    - polkit
    - mkinitcpio
    - kmod
    - kexec-tools
    # proptest for ps5-console-bpc (8 bpc display cap). Temporary: remove with
    # ps5-console-bpc once the 8 bpc kernel default (ps5-linux-patches PR #1)
    # is merged.
    - libdrm
    # grow-rootfs; python also runs ps5-monitors-xml (GNOME)
    - e2fsprogs
    - parted
    - gptfdisk
    - cloud-guest-utils
    - python
    action: install

files:
- path: /etc/hostname
  generator: hostname

- path: /etc/hosts
  generator: hosts

- path: /etc/kernel/postinst.d/zz-update-boot
  generator: copy
  source: /tmp/build-staging/zz-update-boot
  mode: "0755"

- path: /etc/fstab
  generator: copy
  source: /tmp/build-staging/fstab

- path: /usr/local/sbin/grow-rootfs
  generator: copy
  source: /tmp/build-staging/grow-rootfs
  mode: "0755"

- path: /etc/systemd/system/grow-rootfs.service
  generator: copy
  source: /tmp/build-staging/grow-rootfs.service

- path: /usr/local/sbin/ps5-first-boot-setup
  generator: copy
  source: /tmp/build-staging/ps5-first-boot-setup
  mode: "0755"

- path: /etc/systemd/system/ps5-first-boot-setup.service
  generator: copy
  source: /tmp/build-staging/ps5-first-boot-setup.service

- path: /usr/local/sbin/ps5-install-desktop
  generator: copy
  source: /tmp/build-staging/ps5-install-desktop
  mode: "0755"

- path: /usr/local/sbin/ps5-monitors-xml
  generator: copy
  source: /tmp/build-staging/ps5-monitors-xml
  mode: "0755"

- path: /etc/systemd/system/ps5-monitors-xml.service
  generator: copy
  source: /tmp/build-staging/ps5-monitors-xml.service

- path: /usr/local/sbin/ps5-console-bpc
  generator: copy
  source: /tmp/build-staging/ps5-console-bpc
  mode: "0755"

- path: /etc/systemd/system/ps5-console-bpc.service
  generator: copy
  source: /tmp/build-staging/ps5-console-bpc.service

- path: /etc/systemd/system-preset/10-ps5.preset
  generator: copy
  source: /tmp/build-staging/10-ps5.preset

- path: /opt/pkgs/
  generator: copy
  source: /tmp/build-staging/pkgs

actions:
- trigger: post-unpack
  action: |-
    #!/bin/bash
    set -eux
    # Pacman 7 Landlock sandbox is unsupported under QEMU; disable it.
    sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf

    # Initialise pacman keyring
    pacman-key --init
    pacman-key --populate archlinux

    # Fetch up-to-date HTTPS mirrors ranked by score, force-refresh package DBs
    curl -fsSL "https://archlinux.org/mirrorlist/?country=all&protocol=https&use_mirror_status=on" \
        | sed 's/^#Server/Server/' > /etc/pacman.d/mirrorlist
    pacman -Syy --noconfirm

- trigger: post-packages
  action: |-
    #!/bin/bash
    set -eux
    # SSH installed but not enabled; root login off
    sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/'               /etc/ssh/sshd_config
    sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config

    # Defaults until first boot asks (en_US.UTF-8, us keyboard, UTC)
    sed -i 's/^#en_US.UTF-8 UTF-8/en_US.UTF-8 UTF-8/' /etc/locale.gen
    locale-gen
    echo 'LANG=en_US.UTF-8' > /etc/locale.conf
    echo 'KEYMAP=us' > /etc/vconsole.conf
    ln -sf /usr/share/zoneinfo/Etc/UTC /etc/localtime

- trigger: post-files
  action: |-
    #!/bin/bash
    set -eux
    # Enable units with symlinks: systemctl can SIGSEGV under QEMU when the
    # image platform is linux/amd64 on arm64 hosts.
    wants() {
      mkdir -p "/etc/systemd/system/$2.wants"
      ln -sf "$1" "/etc/systemd/system/$2.wants/$(basename "$1")"
    }
    wants /usr/lib/systemd/system/NetworkManager.service multi-user.target
    wants /etc/systemd/system/grow-rootfs.service local-fs.target
    wants /etc/systemd/system/ps5-console-bpc.service sysinit.target
    wants /etc/systemd/system/ps5-first-boot-setup.service multi-user.target
    # ps5-monitors-xml.service is enabled by ps5-install-desktop (GNOME only)
    ln -sf /usr/lib/systemd/system/multi-user.target /etc/systemd/system/default.target

    # No default user: ps5-first-boot-setup asks for locale, keyboard,
    # timezone, username and password on tty1 at first boot. Root is
    # locked; sudo asks for the password.
    passwd -l root
    echo "%wheel ALL=(ALL:ALL) ALL" > /etc/sudoers.d/wheel
    chmod 0440 /etc/sudoers.d/wheel
    printf 'ps5\n' > /etc/hostname

    # Drop autodetect — it detects the build host's hardware, not the target.
    # This produces a larger but hardware-independent initramfs.
    sed -i 's/ autodetect//' /etc/mkinitcpio.conf

    # Install custom kernel packages
    pacman -U --noconfirm --ask 4 /opt/pkgs/*.pkg.tar.zst
    rm -rf /opt/pkgs
    KVER=$(ls -1t /lib/modules | head -1)
    # mkinitcpio may warn about missing optional modules; don't fail on those
    mkinitcpio -k "$KVER" -g "/boot/initrd.img-$KVER" || true
    [ -s "/boot/initrd.img-$KVER" ]

    mkdir -p /boot/efi
    /etc/kernel/postinst.d/zz-update-boot

    # IgnorePkg keeps `pacman -Syu` from replacing our patched linux-ps5
    # kernel with an upstream Arch kernel and breaking boot. It's only
    # honoured under [options] — appending to end of pacman.conf lands
    # under [multilib] which pacman ignores + complains about each Syu.
    sed -i '/^IgnorePkg/d' /etc/pacman.conf
    sed -i '/^\[options\]/a IgnorePkg = linux-ps5' /etc/pacman.conf
- trigger: post-files
  action: |-
    #!/bin/bash
    # Pre-configure repo.etawen.dev (mia's signed kernel repo) so users get
    # linux-ps5 updates via pacman -Syu after first boot.
    set -eux
    curl -fsSL https://repo.etawen.dev/key.asc | pacman-key --add -
    pacman-key --lsign-key E40FB2409C9AD5243762294293AB12C4159FEDAB
    if ! grep -q "^\[ps5\]" /etc/pacman.conf; then
        cat >> /etc/pacman.conf <<EOF

    [ps5]
    SigLevel = Required DatabaseRequired
    Server = https://repo.etawen.dev/arch
    EOF
    fi


mappings:
  architecture_map: archlinux
