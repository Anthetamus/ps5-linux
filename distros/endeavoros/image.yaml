image:
  name: ps5-endeavoros
  distribution: archlinux
  description: EndeavourOS (Arch base + [endeavouros] repo) with KDE Plasma
  architecture: x86_64

source:
  downloader: archlinux-http
  url: https://geo.mirror.pkgbuild.com/iso
  skip_verification: true

packages:
  manager: pacman
  update: true
  cleanup: true

  repositories:
  - name: mirrorlist
    url: |-
      Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

  sets:
  - packages:
    # KDE Plasma desktop (EndeavourOS flagship) + SDDM graphical login
    - plasma-meta
    - sddm
    - qt6-wayland
    - egl-wayland
    - konsole
    - dolphin
    - kate
    - firefox

    # X11 (SDDM greeter) + Wayland bridge for X11 apps
    - xorg-server
    - xorg-xwayland

    # Audio / media
    - pipewire
    - wireplumber
    - pipewire-pulse

    # Display / GPU (AMD)
    - mesa
    - vulkan-radeon
    - libva-mesa-driver
    - xf86-video-amdgpu
    - libinput
    - xkeyboard-config

    # Networking
    - networkmanager
    - linux-firmware
    # GIO module libgiognutls.so (GVfs etc.): needs gnutls → nettle.
    # Explicit install avoids a sparse dependency tree under cleanup: true.
    - gnutls
    - nettle
    - glib-networking

    # System
    - base
    - openssh
    - sudo
    - nano
    - bash
    - mkinitcpio
    - kmod
    - e2fsprogs
    - parted
    - gptfdisk
    - cloud-guest-utils
    - polkit
    - dbus
    - kexec-tools
    - curl

    # Fonts
    - ttf-dejavu
    - ttf-liberation
    - noto-fonts
    - noto-fonts-cjk
    - noto-fonts-emoji
    - ttf-font-awesome
    - fontconfig
    action: install

files:
- path: /etc/hostname
  generator: hostname

- path: /etc/hosts
  generator: hosts

- path: /etc/kernel/postinst.d/zz-update-boot
  generator: copy
  source: /tmp/build-staging/zz-update-boot
  mode: "0755"

- path: /etc/fstab
  generator: copy
  source: /tmp/build-staging/fstab

- path: /usr/local/sbin/grow-rootfs
  generator: copy
  source: /tmp/build-staging/grow-rootfs
  mode: "0755"

- path: /etc/systemd/system/grow-rootfs.service
  generator: copy
  source: /tmp/build-staging/grow-rootfs.service

- path: /opt/pkgs/
  generator: copy
  source: /tmp/build-staging/pkgs

- path: /usr/local/sbin/first-boot-setup
  generator: copy
  source: /tmp/build-staging/first-boot-setup
  mode: "0755"

actions:
- trigger: post-unpack
  action: |-
    #!/bin/bash
    set -eux
    # Pacman 7 Landlock sandbox is unsupported under QEMU; disable it.
    sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf

    # Initialise pacman keyring
    pacman-key --init
    pacman-key --populate archlinux

    # Bootstrap the EndeavourOS repo: keyring + mirrorlist package URLs are
    # versioned, so resolve the latest filename from the mirror listing.
    EOSREPO=""
    for m in "https://mirror.alpix.eu/endeavouros/repo/endeavouros/x86_64" \
             "https://mirror.moson.org/eos/repo/endeavouros/x86_64"; do
        if curl -fsSL --connect-timeout 10 "$m/" >/dev/null; then EOSREPO="$m"; break; fi
    done
    [ -n "$EOSREPO" ] || { echo "no endeavouros mirror reachable"; exit 1; }
    for p in endeavouros-keyring endeavouros-mirrorlist; do
        f=$(curl -fsSL "$EOSREPO/" | grep -oE "${p}-[0-9][^\"']*-any\.pkg\.tar\.zst" | sort -V | tail -1)
        [ -n "$f" ] || { echo "could not resolve latest $p from $EOSREPO"; exit 1; }
        curl -fsSL -o "/tmp/$f" "$EOSREPO/$f"
    done
    pacman -U --noconfirm /tmp/endeavouros-*.pkg.tar.zst

    # Listed after Arch repos so core/extra/multilib win on conflicts.
    if ! grep -q '^\[endeavouros\]' /etc/pacman.conf; then
        printf '\n[endeavouros]\nSigLevel = PackageRequired\nInclude = /etc/pacman.d/endeavouros-mirrorlist\n' >> /etc/pacman.conf
    fi

    # Fetch up-to-date HTTPS mirrors ranked by score, force-refresh package DBs
    curl -fsSL "https://archlinux.org/mirrorlist/?country=all&protocol=https&use_mirror_status=on" \
        | sed 's/^#Server/Server/' > /etc/pacman.d/mirrorlist
    pacman -Syy --noconfirm


- trigger: post-packages
  action: |-
    #!/bin/bash
    set -eux
    # fc-cache / systemctl can SIGSEGV under QEMU when image plat is linux/amd64 on arm64 hosts.
    fc-cache -f 2>/dev/null || true

    # EndeavourOS extras from the [endeavouros] repo (welcome app, branding,
    # Plasma settings, SDDM theme, log tool). Tolerate failure — a renamed eos
    # package must not kill the whole build; the desktop works without them.
    pacman -S --noconfirm --needed welcome endeavouros-branding eos-settings-plasma eos-breeze-sddm eos-log-tool || true

    symlink_wants() {
      local src=$1
      local target=$2
      [ -e "$src" ] || return 0
      mkdir -p "/etc/systemd/system/${target}.wants"
      ln -sf "$src" "/etc/systemd/system/${target}.wants/$(basename "$src")"
    }

    sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/'               /etc/ssh/sshd_config
    sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
    symlink_wants /usr/lib/systemd/system/sshd.service multi-user.target
    symlink_wants /usr/lib/systemd/system/NetworkManager.service multi-user.target
    # Graphical login via SDDM (EndeavourOS default).
    symlink_wants /usr/lib/systemd/system/sddm.service graphical.target

- trigger: post-files
  action: |-
    #!/bin/bash
    set -eux
    mkdir -p /etc/systemd/system/local-fs.target.wants
    ln -sf /etc/systemd/system/grow-rootfs.service \
      /etc/systemd/system/local-fs.target.wants/grow-rootfs.service

    # Create default user (ps5/ps5)
    useradd -m -G wheel,video,audio,input -s /bin/bash ps5
    echo "ps5:ps5" | chpasswd
    echo "%wheel ALL=(ALL:ALL) NOPASSWD: ALL" > /etc/sudoers.d/wheel

    # Graphical target by default (SDDM login screen).
    ln -sf /usr/lib/systemd/system/graphical.target /etc/systemd/system/default.target

    # Ensure vconsole.conf exists (needed by mkinitcpio sd-vconsole hook)
    [ -f /etc/vconsole.conf ] || echo "KEYMAP=us" > /etc/vconsole.conf

    # Drop autodetect — it detects the build host's hardware, not the target.
    # This produces a larger but hardware-independent initramfs.
    sed -i 's/ autodetect//' /etc/mkinitcpio.conf

    # Install custom kernel packages
    if ls /opt/pkgs/*.pkg.tar.zst 1>/dev/null 2>&1; then
        pacman -U --noconfirm --ask 4 /opt/pkgs/*.pkg.tar.zst
        rm -rf /opt/pkgs
        KVER=$(ls -1t /lib/modules | head -1)
        # mkinitcpio may warn about missing optional modules; don't fail on those
        mkinitcpio -k "$KVER" -g "/boot/initrd.img-$KVER" || true
    fi

    mkdir -p /boot/efi
    /etc/kernel/postinst.d/zz-update-boot

    # IgnorePkg keeps `pacman -Syu` from replacing our patched linux-ps5
    # kernel with an upstream Arch kernel and breaking boot. It's only
    # honoured under [options] — appending to end of pacman.conf lands
    # under [endeavouros] which pacman ignores + complains about each Syu.
    sed -i '/^IgnorePkg/d' /etc/pacman.conf
    sed -i '/^\[options\]/a IgnorePkg = linux-ps5' /etc/pacman.conf
- trigger: post-files
  action: |-
    #!/bin/bash
    # Pre-configure repo.etawen.dev (mia's signed kernel repo) so users get
    # linux-ps5 updates via pacman -Syu after first boot.
    set -eux
    curl -fsSL https://repo.etawen.dev/key.asc | pacman-key --add -
    pacman-key --lsign-key E40FB2409C9AD5243762294293AB12C4159FEDAB
    if ! grep -q "^\[ps5\]" /etc/pacman.conf; then
        cat >> /etc/pacman.conf <<EOF

    [ps5]
    SigLevel = Required DatabaseRequired
    Server = https://repo.etawen.dev/arch
    EOF
    fi


mappings:
  architecture_map: archlinux
